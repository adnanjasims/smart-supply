#default training + mlops settings for smartsupply
data:
  sales: sales_train_validation.csv
  calendar: calendar.csv
  prices: sell_prices.csv
  store_id: CA_1
  cat_id: FOODS
  lookback_days: 730
  holdout_days: 60

train:
  n_cv_splits: 4
  num_boost_round: 1000
  cv_boost_round: 400
  skip_tuning: false
  seed: 42

mlops:
  artifacts_dir: artifacts
  experiment_name: smartsupply-demand
  auto_promote: false

#fail the run if these checks do not pass
gates:
  max_val_mae: 3.0
  min_profit_lift: 0.0
  min_q90_ge_q75_frac: 0.80
  require_no_fallback: true
  min_rows_after_features: 1000
